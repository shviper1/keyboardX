name: Build iOS Simulator App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Generate Xcode project with XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate
          # Ensure compatibility with both Xcode 15 and Xcode 16
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' KeyboardX.xcodeproj/project.pbxproj

      - name: Run Logic Tests
        run: ./scripts/verify.sh

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project KeyboardX.xcodeproj \
            -scheme KeyboardXApp \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Stage KeyboardXApp.app for Artifact
        run: |
          mkdir -p artifact_staging
          cp -R build/Build/Products/Release-iphonesimulator/KeyboardXApp.app artifact_staging/

      - name: Upload Simulator App Artifact (Ready for Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardXApp-Simulator
          path: artifact_staging/
