name: Build iOS Simulator App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-simulator:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Xcode project with XcodeGen
        run: |
          brew install xcodegen
          xcodegen generate
          # Downgrade pbxproj objectVersion so Xcode 15.4 can open it
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' KeyboardX.xcodeproj/project.pbxproj

      - name: Run Logic Tests
        run: ./scripts/verify.sh

      - name: Build for iOS Simulator (Ad-Hoc Signed for Appetize.io)
        run: |
          xcodebuild \
            -project KeyboardX.xcodeproj \
            -scheme KeyboardXApp \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            clean build

      - name: Re-sign App and Extension for Simulator installd
        run: |
          APP_PATH="build/Build/Products/Release-iphonesimulator/KeyboardXApp.app"
          chmod +x "$APP_PATH/KeyboardXApp"
          if [ -d "$APP_PATH/PlugIns/KeyboardExtension.appex" ]; then
            chmod +x "$APP_PATH/PlugIns/KeyboardExtension.appex/KeyboardExtension"
            codesign --force --sign - --timestamp=none "$APP_PATH/PlugIns/KeyboardExtension.appex"
          fi
          codesign --force --sign - --timestamp=none "$APP_PATH"

      - name: Package KeyboardXApp.app into zip
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -ry "$GITHUB_WORKSPACE/KeyboardXApp-Simulator.zip" KeyboardXApp.app

      - name: Upload Simulator App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyboardXApp-Simulator
          path: KeyboardXApp-Simulator.zip
